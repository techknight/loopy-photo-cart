# Burgmuller, La Candeur (Op. 100 No. 1) -- light, flowing, Allegro moderato.
#
# Source MIDI channels:
#   0  right hand (peak 3 notes)  -> console channel 0 (six voices)
#   1  left hand  (peak 3 notes)  -> console channel 1 (four voices)
# Console channel 2 is left to the sound effects; channel 3 is unused.
#
# Program 1 is the ROM's piano-like preset (not layered).

name = "candeur"
# Not looped: the cart plays it, then Clementi, then repeats both
# (platform/lp_sound.c).
loop = false

[chan_map]
0 = [0, 1]
1 = [1, 1]
