name: Web app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          npm ci
          pip install pillow

      - name: Generated tables are current
        run: python ../cart/tools/mkwebfonts.py --check

      - name: Unit and golden tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke test in Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run smoke -- smoke-out ../demo/photos/photo01.jpg ../demo/photos/photo08.jpg
          python ../cart/tools/lpcvalidate.py smoke-out/smoke.bin

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: web/dist

  # Publishes https://loopyphotocart.com: Pages is set to "GitHub Actions" with
  # that custom domain in the repository settings. The build uses a relative
  # base, so it works at the domain root.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
