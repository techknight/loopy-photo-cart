name: Release

# Tag a commit v* to publish: the cartridge template, the demo ROM (the cat
# photos in demo/, built by the web app's own core), and the built site.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache the Wonderful Toolchain
        uses: actions/cache@v4
        with:
          path: ~/wonderful
          key: wonderful-sh-elf-${{ runner.os }}-v1

      - name: Build the cartridge template
        run: |
          pip install pillow
          bash cart/scripts/setup-toolchain.sh
          make -C cart WONDERFUL_TOOLCHAIN="$HOME/wonderful" BUILD_ID="${GITHUB_REF_NAME:0:16}"

      - name: The web app uses this exact template
        working-directory: web
        run: |
          npm ci
          npm run sync-template
          npm test

      - name: Build the demo ROM
        working-directory: web
        run: |
          mkdir -p ../demo/build
          npm run demo
          python ../cart/tools/lpcvalidate.py ../demo/build/loopy-photo-cart-demo.bin

      - name: Build the site
        working-directory: web
        run: |
          npm run build
          (cd dist && zip -qr ../../loopy-photo-cart-site.zip .)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            cart/build/loopy-photo-cart-template.bin \
            demo/build/loopy-photo-cart-demo.bin \
            demo/build/loopy-photo-cart-demo-byteswapped.bin \
            loopy-photo-cart-site.zip
